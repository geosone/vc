; INSTALL.INI of the GeosOne Dual Installer (https://github.com/geosone/gdi)
; for the Volkov Commander; code page 850, CRLF.  `make release` puts it next
; to INSTALL.EXE, the program and the files of files/.
[Setup]
Title=Volkov Commander Setup
Product=Volkov Commander 4.99.10 alpha
Id=VC
Version=4.99.10
License=Volkov Commander|LICENSE.TXT
Readme=VCINFO.TXT
DefaultDir=%BOOT%\VC
Done=The Volkov Commander is installed. Start it with VC.

[Welcome]
This setup installs the Volkov Commander 4.99.10 alpha, a two-panel file
manager for DOS in the style of the Norton Commander, by Vsevolod V. Volkov.

The author published its sources under the BSD license; this version is
built from those of 4.99.09 with JWasm and adds the help. It is a test
version.

The help (F1) is that of VC 4.05: in English, German, Russian, Polish or
Slovak. Setup proposes the language of COUNTRY= in CONFIG.SYS.

[Options]
Option=off|Put the directory of the Commander into the PATH
Option=on|Add it to the Program Manager of Windows

; the language of the help: Choice=code|name|country codes of COUNTRY=
[Languages]
Default=en
Choice=en|English
Choice=de|Deutsch|49,43,41,423
Choice=ru|Russkij|7,375,380
Choice=pl|Polski|48
Choice=sk|Slovensky|421

